name: Build Android App (.apk)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Web Bundle
        run: npm run build

      - name: Initialize Capacitor Android Project
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android
          node -e "
            const fs = require('fs');
            const p = 'android/app/src/main/AndroidManifest.xml';
            let xml = fs.readFileSync(p, 'utf8');
            if (!xml.includes('usesCleartextTraffic')) {
              xml = xml.replace('<application', '<application android:usesCleartextTraffic=\"true\"');
              fs.writeFileSync(p, xml, 'utf8');
            }
          "

      - name: Configure Android App Icons
        run: |
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$dir"
            cp public/pwa-512x512.png "android/app/src/main/res/$dir/ic_launcher.png"
            cp public/pwa-maskable-512x512.png "android/app/src/main/res/$dir/ic_launcher_round.png"
            if [ -f "android/app/src/main/res/$dir/ic_launcher_foreground.png" ]; then
              cp public/pwa-maskable-512x512.png "android/app/src/main/res/$dir/ic_launcher_foreground.png"
            fi
          done

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Artifact
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Locat-Monitor-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Locat-Monitor-Android-APK
          path: release/Locat-Monitor-Android.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Locat-Monitor-Android.apk
          generate_release_notes: true
