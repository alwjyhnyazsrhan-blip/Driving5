name: Build Desktop App (.exe / AppImage)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Build web UI & embedded server
        run: npm run build

      - name: Install Electron & Builder (CI only)
        run: npm install --no-save electron@35.2.0 electron-builder@25.1.8

      - name: Configure Electron entry & package Windows EXE
        shell: bash
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.main="electron/main.cjs";if(!p.version||p.version==="0.0.0")p.version="1.0.0";p.devDependencies=p.devDependencies||{};p.devDependencies.electron="35.2.0";fs.writeFileSync("package.json",JSON.stringify(p,null,2));'
          npx electron-builder --win --config electron-builder.yml --publish never

      - name: Upload Windows App (.exe) Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Locat-Monitor-Windows-App
          path: |
            release/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
          generate_release_notes: true
