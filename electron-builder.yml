appId: com.locat.monitor
productName: Locat Monitor
copyright: Copyright © 2026 Locat Monitor
directories:
  output: release
  buildResources: public
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/.cache"
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: public/pwa-512x512.png
  artifactName: Locat-Monitor-${version}-${arch}-${target}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Locat Monitor
mac:
  target:
    - dmg
  icon: public/pwa-512x512.png
  category: public.app-category.business
linux:
  target:
    - AppImage
  icon: public/pwa-512x512.png
  category: Office
